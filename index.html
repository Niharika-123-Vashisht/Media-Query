<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="box">

        
        <img class="main-image"
        src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600"
        alt="Blog Image">

        <div class="label">Learning</div>
        <p class="date">Published 21 Dec 2023</p>
        <h2>HTML & CSS foundations</h2>
        <p class="info">
            These languages are the backbone of every website,
            defining structure, content, and presentation.
        </p>
        <div class="person">
            <img src="https://i.pravatar.cc/40" alt="Author">
            <span>Greg Hooper</span>
        </div>

    </div>

</body>
</html>
